name: ci

on:
  push:
    branches: [main, feat/v1-core]
  pull_request:

jobs:
  linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - run: dotnet restore UnionFlight.sln
      - run: dotnet build UnionFlight.sln -c Release --no-restore
      - run: dotnet test UnionFlight.sln -c Release --no-build
